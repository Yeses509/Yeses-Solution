/* aurora */
.bean{position:absolute;width:20px;height:30px;border-radius:50%;background:#4a2812;box-shadow:inset -3px -3px 6px rgba(0,0,0,.5);animation:flo 7s ease-in-out infinite;z-index:1}

.cup{filter:drop-shadow(0 30px 60px rgba(224,138,60,.35));animation:flo 8s ease-in-out infinite}
/* pulse */
.gt{position:absolute;left:50%;top:50%;font-family:var(--fh);font-size:34vw;line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px var(--a);opacity:.14;margin-left:-45vw;margin-top:-20vw}

<script>
/* REVIEWS: dynamic testimonials — localStorage store, example seeds, review form with star rating */
(function(){
var KEY='ys_reviews_v1';
var SEED=[
 {n:'James Whitfield',co:'Brightline Studio',ctry:'United States',stars:5,sample:true,
  text:'YESES turned our idea into a website in days. It looks exactly like our brand.'},
 {n:'Sarah Mitchell',co:'Bloom & Bean Café',ctry:'United States',stars:5,sample:true,
  text:'Fast, clear communication and a design that feels premium. Our online bookings doubled after launch.'},
 {n:'Layla Haddad',co:'Noor Boutique',ctry:'United Arab Emirates',stars:5,sample:true,
  text:'Professional, on time, and the website came out better than we imagined. Highly recommended.'}
];
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(r))return r;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(reviews));}catch(e){}}
var reviews=load();
if(!reviews){reviews=SEED.slice();save();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function starsHTML(s){var h='';for(var i=1;i<=5;i++)h+=i<=s?'\u2605':'\u2606';return '<div class="rv-stars">'+h+'</div>';}
function cardHTML(r,idx){
  var who=esc(r.n)+(r.co?' \u00B7 '+esc(r.co):'')+(r.ctry?', '+esc(r.ctry):'');
  return '<div class="c rv2 in">'
    +(r.sample?'<button type="button" class="rv-del" data-del="'+idx+'" aria-label="Remove example">\u00D7</button><span class="rv-badge">EXAMPLE</span>':'')
    +starsHTML(r.stars)+'<p class="q">\u201C'+esc(r.text)+'\u201D</p><span class="who">'+who+'</span></div>';
}
function paintAgg(){
  var el=document.querySelector('.rv-ag');if(!el)return;
  var real=reviews.filter(function(r){return !r.sample;});
  if(!real.length){el.innerHTML='<span>No reviews yet \u2014 be the first to share your experience!</span>';return;}
  var avg=real.reduce(function(a,r){return a+r.stars;},0)/real.length;
  el.innerHTML='<b>'+avg.toFixed(1)+'</b><span class="au">\u2605</span><span>\u00B7 '+real.length+' review'+(real.length>1?'s':'')+'</span>';
}
function paint(){
  var grids=document.querySelectorAll('[data-r="tst"]');
  if(!grids.length)return;
  var html='';
  for(var i=0;i<reviews.length;i++)html+=cardHTML(reviews[i],i);
  grids.forEach(function(g){g.innerHTML=html;});
  paintAgg();
  document.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick=function(){reviews.splice(+b.getAttribute('data-del'),1);save();paint();};
  });
}
var COUNTRIES=['United States','United Arab Emirates','Saudi Arabia','Iraq','Egypt','Jordan','Lebanon','Syria','Kuwait','Qatar','Bahrain','Oman','Morocco','Tunisia','Algeria','Other'];
function buildForm(){
  if(document.querySelector('.rv-wrap'))return;
  var grid=document.querySelector('#p-home [data-r="tst"]');
  if(!grid)return;
  var w=document.createElement('div');w.className='rv-wrap';

  w.innerHTML='<div class="rv-ag"></div>'
    +'<button type="button" class="bt rv-toggle">\u270E Write a review</button>'
    +'<form class="rv-form" hidden novalidate>'
    +'<div class="two"><input name="n" maxlength="60" placeholder="Your name *" autocomplete="name">'
    +'<input name="co" maxlength="60" placeholder="Company (optional)" autocomplete="organization"></div>'
    +'<div class="two"><select name="ctry" required>'+opts+'</select>'
    +'<div><p class="rv-lab">Your rating *</p><div class="stars-in" role="radiogroup" aria-label="Star rating">'+starBtns+'</div></div></div>'
    +'<input type="hidden" name="stars" value="0">'
    +'<textarea name="text" rows="4" maxlength="600" placeholder="Your review *"></textarea>'
    +'<p class="rv-err"></p>'
    +'<div><button class="bt" type="submit">Submit review</button></div>'
    +'</form>';
  grid.after(w);
  w.querySelector('.rv-toggle').addEventListener('click',function(){
    var f=w.querySelector('.rv-form');f.hidden=!f.hidden;
    if(!f.hidden)f.querySelector('[name=n]').focus();
  });
  var stars=w.querySelector('.stars-in'),sh=w.querySelector('[name=stars]');
  function lit(v){stars.querySelectorAll('button').forEach(function(b){b.classList.toggle('lit',+b.getAttribute('data-v')<=v);});}
  stars.addEventListener('mouseover',function(e){var b=e.target.closest?e.target.closest('button'):null;if(b)lit(+b.getAttribute('data-v'));});
  stars.addEventListener('mouseout',function(){lit(+sh.value||0);});
  stars.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('button'):null;if(b){sh.value=b.getAttribute('data-v');lit(+sh.value);}});
  w.querySelector('.rv-form').addEventListener('submit',function(e){
    e.preventDefault();
    var f=e.target,err=w.querySelector('.rv-err');
    var n=f.querySelector('[name=n]').value.trim(),
        co=f.querySelector('[name=co]').value.trim(),
        ctry=f.querySelector('[name=ctry]').value,
        st=+f.querySelector('[name=stars]').value,
        tx=f.querySelector('[name=text]').value.trim();
    if(!n){err.textContent='Please enter your name.';return;}
    if(!ctry){err.textContent='Please choose your country.';return;}
    if(!st){err.textContent='Please tap the stars to rate.';return;}
    if(tx.length<4){err.textContent='Please write a few words.';return;}
    reviews.unshift({n:n,co:co,ctry:ctry,stars:st,text:tx,sample:false,ts:Date.now()});
    save();paint();
    f.reset();sh.value='0';lit(0);err.textContent='';
    f.hidden=true;
    var ok=document.createElement('p');ok.className='rv-ok';ok.textContent='Thank you! Your review was added below.';
    w.querySelector('.rv-toggle').after(ok);
    setTimeout(function(){if(ok.parentNode)ok.parentNode.removeChild(ok);},4500);
  });
}

ch:{en:"Our own studio website had grown to 1.17 MB in a single page — on phones it painted slowly and showed white screens while loading.",ar:"موقع الاستوديو نفسه كبر حتى وصل إلى ١٫١٧ ميغابايت في صفحة واحدة — وعلى الجوال كان يرسم ببطء ويعرض شاشات بيضاء أثناء التحميل.",ku:"ماڵپەڕی ستۆدیۆکەی خۆمان گەورە بووبوو تا ١٫١٧ مێگابایت لە یەک پەڕەدا — لەسەر مۆبایل بە هێواشی دەکێشرا و شاشەی سپی پیشان دەدا لە کاتی بارکردندا."},
so:{en:"We rebuilt how it loads: portfolio covers moved out of the code into compressed files that load only when scrolled to, fonts stopped blocking the first paint, the 3D library moved to the end of the page, and a self-update check keeps every visitor on the latest version.",ar:"أعدنا بناء طريقة تحميله: صور الأعمال خرجت من الكود إلى ملفات مضغوطة تُحمّل فقط عند الوصول إليها، والخطوط توقفت عن حجب أول رسم، ومكتبة الرسوميات نُقلت لآخر الصفحة، وفحص تحديث ذاتي يُبقي كل زائر على أحدث نسخة.",ku:"شێوازی بارکردنیمان لە نوێ بنیات نا: وێنەکانی کارەکان لە کۆدەکە هاتنە دەرەوە بۆ فایلی پاڵێوراو کە تەنها کاتێک باردەکرێن کە دەگەیتە لایان، فۆنتەکان وەستان لە گیرکردنی یەکەم کێشان، کتێبخانەی 3D چووە کۆتایی پەڕەکە، و پشکنینی نوێکردنەوەی خۆکار هەموو سەردانکەرێک لەسەر نوێترین وەشان دەهێڵێتەوە."},
re:{en:"The homepage fell from 1,176 KB to 274 KB — 77% lighter — and now paints immediately, even on a first visit from a phone. It is the same speed work we do for clients.",ar:"الصفحة الرئيسية انخفضت من ١٬١٧٦ إلى ٢٧٤ كيلوبايت — أخف بنسبة ٧٧٪ — وترسم الآن فوراً حتى في أول زيارة من جوال. إنه نفس عمل السرعة الذي نقدمه لعملائنا.",ku:"پەڕەی سەرەکی لە ١٬١٧٦ کیلۆبایتەوە دابەزی بۆ ٢٧٤ کیلۆبایت — ٧٧٪ سووکتر — و ئێستا دەستبەجێ دەکێشرێت، تەنانەت لە یەکەم سەردان لە مۆبایلەوە. هەمان کاری خێراییە کە بۆ کڕیارەکانمان دەیکەین."}}

var ART=[
{t:{en:"How much does a website cost in 2026?",ar:"كم يكلف إنشاء موقع إلكتروني في 2026؟",ku:"تێچووی ماڵپەڕێک لە ٢٠٢٦ چەندە؟"},
x:{en:"Microsite, business site or online store — what really drives the price, and what to watch out for.",
ar:"موقع مصغر أم موقع شركة أم متجر — ما الذي يحدد السعر فعلاً، وما الذي يجب أن تنتبه له.",
ku:"ماڵپەڕی بچووک، ماڵپەڕی کۆمپانیا یان فرۆشگا — چی بەڕاستی نرخەکە دیاری دەکات و دەبێت ئاگاداری چی بیت."},
b:{en:["Most small businesses pay between $499 and $2,999 for a professional website. A microsite (a landing page or a small site) starts around $499. A full business website with up to six pages is usually around $999. A complete online store with products, payments and shipping starts around $2,999.",
"What changes the price is not the number of pages alone. An online booking system, extra languages, written content and a full brand identity each add work — and value. Ongoing care matters too: updates, backups and security typically cost about $10 a month, or less on a yearly plan.",
"Be careful with quotes that look too cheap. A website that loads slowly, breaks on phones or cannot be found on Google costs you customers every week. A clear quote, a delivery date and ownership of your own site are worth more than the lowest price."],
ar:["تدفع أغلب الشركات الصغيرة بين 499$ و2999$ مقابل موقع احترافي. الموقع المصغر (صفحة هبوط أو موقع صغير) يبدأ من حوالي 499$. وموقع الشركة الكامل حتى ست صفحات يكون عادةً حوالي 999$. أما المتجر الإلكتروني الكامل بالمنتجات والدفع والشحن فيبدأ من حوالي 2999$.",
"الذي يغيّر السعر ليس عدد الصفحات وحده. نظام الحجز الإلكتروني واللغات الإضافية وكتابة المحتوى والهوية البصرية الكاملة، كل منها يضيف عملاً — وقيمة. والصيانة المستمرة مهمة أيضاً: التحديثات والنسخ الاحتياطي والحماية تكلف عادةً حوالي 10$ شهرياً، أو أقل مع الخطة السنوية.",
"احذر العروض الرخيصة جداً. الموقع البطيء أو الذي يتعطل على الجوال أو لا يظهر في Google يكلّفك عملاء كل أسبوع. عرض سعر واضح وموعد تسليم محدد وملكية كاملة لموقعك أهم من السعر الأقل."],
ku:["زۆربەی کارە بچووکەکان لە نێوان ٤٩٩$ و ٢٩٩٩$ دەدەن بۆ ماڵپەڕێکی پیشەیی. ماڵپەڕی بچووک (لاپەڕەی نیشتن یان ماڵپەڕێکی بچووک) لە دەوروبەری ٤٩٩$ دەست پێدەکات. ماڵپەڕی تەواوی کۆمپانیا تا شەش لاپەڕە بەزۆری دەوروبەری ٩٩٩$ە. فرۆشگای ئەلیکترۆنی تەواو بە بەرهەم و پارەدان و گەیاندنەوە لە دەوروبەری ٢٩٩٩$ دەست پێدەکات.",
"ئەوەی نرخەکە دەگۆڕێت تەنها ژمارەی لاپەڕەکان نییە. سیستەمی حیجزکردن، زمانە زیادەکان، نووسینی ناوەڕۆک و ناسنامەی بینراوی تەواو، هەریەکەیان کار — و بەها — زیاد دەکەن. چاوەدێری بەردەوامیش گرنگە: نوێکردنەوە و پاشەکەوت و ئاسایش بەزۆری دەوروبەری ١٠$ مانگانە دەکەوێت، یان کەمتر بە پلانی ساڵانە.",
"ئاگاداری نرخە زۆر هەرزانەکان بە. ماڵپەڕێکی خاو، یان ئەوەی لەسەر مۆبایل دەشکێت یان لە Google نادۆزرێتەوە، هەموو هەفتەیەک کڕیار لەدەست دەدەیت. نرخێکی ڕوون و بەرواری گەیاندن و خاوەندارێتی تەواوی ماڵپەڕەکەت لە هەرزانترین نرخ گرنگترە."]}},
{t:{en:"5 things every local business website must have",ar:"5 أشياء يجب أن تتوفر في موقع أي شركة محلية",ku:"٥ شت کە دەبێت لە ماڵپەڕی هەر کارێکی خۆجێی هەبێت"},
x:{en:"Most visitors decide in seconds. These five basics decide whether they call you — or your competitor.",
ar:"أغلب الزوار يقررون خلال ثوانٍ. هذه الأساسيات الخمسة تحدد إن كانوا سيتصلون بك — أم بمنافسك.",
ku:"زۆربەی سەردانکەران لە چەند چرکەیەکدا بڕیار دەدەن. ئەم پێنج بنەمایە بڕیار دەدات ئایا پەیوەندیت پێوە دەکەن — یان بە ڕکابەرەکەت."},
b:{en:["1. Mobile-first design. Most of your visitors arrive from a phone. If buttons are hard to tap or text is hard to read, they leave. 2. One-tap contact. Your phone number and WhatsApp should be one tap away on every page — not hidden inside a contact form.",
"3. Location and hours. Show your address, a map link and your opening hours where Google and visitors can find them. 4. Real photos. People trust real photos of your place, your team and your work far more than stock images. 5. Reviews. Honest reviews from real customers are the strongest reason a stranger chooses you.",
"Add fast loading to all of that: if your site takes more than a few seconds to open, most visitors never see it at all. Get these five right and your website starts working like your best employee."],
ar:["1. تصميم يبدأ من الجوال. أغلب زوارك يأتون من الهاتف؛ إن صعُب الضغط على الأزرار أو قراءة النص، يغادرون. 2. تواصل بضغطة واحدة. رقم هاتفك وواتساب يجب أن يكونا على بُعد ضغطة واحدة في كل صفحة — لا مخفيين داخل نموذج.",
"3. الموقع وساعات العمل. اعرض عنوانك ورابط الخريطة وساعات عملك حيث يجدها Google والزوار. 4. صور حقيقية. الناس يثقون بصور حقيقية لمكانك وفريقك وعملك أكثر بكثير من الصور الجاهزة. 5. التقييمات. التقييمات الصادقة من عملاء حقيقيين هي أقوى سبب يجعل غريباً يختارك.",
"أضف إلى ذلك سرعة التحميل: إن احتاج موقعك أكثر من ثوانٍ قليلة ليفتح، فلن يراه أغلب الزوار أصلاً. طبّق هذه الخمسة وسيبدأ موقعك بالعمل كأفضل موظف عندك."],
ku:["١. دیزاینی مۆبایل-پێشەنگ. زۆربەی سەردانکەرانت لە مۆبایلەوە دێن؛ ئەگەر دوگمەکان سەخت بن بۆ لێدان یان دەق سەخت بێت بۆ خوێندنەوە، دەڕۆن. ٢. پەیوەندی بە یەک لێدان. ژمارەی تەلەفۆن و واتسئەپت دەبێت لە هەموو لاپەڕەیەک بە یەک لێدان بەردەست بن — نەک لە فۆرمێکدا شارابێنەوە.",
"٣. شوێن و کاتەکانی کار. ناونیشان و بەستەری نەخشە و کاتەکانی کارکردنت پیشان بدە لەو شوێنەی Google و سەردانکەران دەیدۆزنەوە. ٤. وێنەی ڕاستەقینە. خەڵک زۆر زیاتر متمانە بە وێنەی ڕاستەقینەی شوێنەکەت و تیمەکەت و کارەکەت دەکەن وەک لە وێنە ئامادەکان. ٥. هەڵسەنگاندنەکان. هەڵسەنگاندنی ڕاستگۆیانە لە کڕیارە ڕاستەقینەکان بەهێزترین هۆکارە بۆ ئەوەی کەسێکی نامۆ تۆ هەڵبژێرێت.",
"خێرایی بارکردنیش بۆ هەموو ئەمانە زیاد بکە: ئەگەر ماڵپەڕەکەت زیاتر لە چەند چرکەیەک بخایەنێت بۆ کردنەوە، زۆربەی سەردانکەران هەرگیز نایبینن. ئەم پێنجە ڕاست بکە و ماڵپەڕەکەت دەست دەکات بە کارکردن وەک باشترین کارمەندت."]}},
{t:{en:"Website or social media? Why your business needs both",ar:"موقع إلكتروني أم سوشيال ميديا؟ لماذا يحتاج عملك الاثنين",ku:"ماڵپەڕ یان سۆشیال میدیا؟ بۆچی کارەکەت هەردووکی پێویستە"},
x:{en:"Social media rents you attention. Your website is the home you own. Here is how they work together.",
ar:"السوشيال ميديا تستأجر لك الانتباه، أما موقعك فهو البيت الذي تملكه. إليك كيف يعملان معاً.",
ku:"سۆشیال میدیا سەرنجت بۆ بە کرێ دەدات. ماڵپەڕەکەت ئەو ماڵەیە کە خاوەنیت. ئەمە چۆنێتی کارکردنیان پێکەوەیە."},
b:{en:["Social media is rented land. The platform decides who sees your posts, and an account problem can erase years of work overnight. Your website is yours: your domain, your rules, your customer list.",
"The two do different jobs. Social media is where people discover you and watch your work. Your website is where they check your menu or prices, read reviews, book and buy — and it is what shows up when someone searches Google for what you do.",
"Businesses that rely on social media alone lose every customer who searches instead of scrolling. Use social to bring people in — and a website to turn them into customers."],
ar:["السوشيال ميديا أرض مستأجرة. المنصة تقرر من يرى منشوراتك، ومشكلة واحدة في الحساب قد تمحو سنوات من العمل في ليلة. أما موقعك فهو ملكك: نطاقك وقواعدك وقائمة عملائك.",
"ولكلٍّ منهما وظيفة مختلفة. السوشيال ميديا حيث يكتشفك الناس ويشاهدون عملك. وموقعك حيث يطّلعون على قائمتك أو أسعارك ويقرأون التقييمات ويحجزون ويشترون — وهو ما يظهر عندما يبحث أحدهم في Google عمّا تقدّمه.",
"الشركات التي تعتمد على السوشيال ميديا وحدها تخسر كل عميل يبحث بدل أن يتصفح. استخدم السوشيال لجلب الناس — والموقع لتحويلهم إلى عملاء."],
ku:["سۆشیال میدیا زەوی بەکرێیە. پلاتفۆرمەکە بڕیار دەدات کێ پۆستەکانت دەبینێت، و کێشەیەک لە هەژمارەکە دەتوانێت ساڵانێک کار لە یەک شەودا بسڕێتەوە. ماڵپەڕەکەت هی خۆتە: دۆمەینەکەت، یاساکانت، لیستی کڕیارەکانت.",
"هەردووکیان کاری جیاواز دەکەن. سۆشیال میدیا ئەو شوێنەیە کە خەڵک تۆ دەدۆزنەوە و کارەکەت دەبینن. ماڵپەڕەکەت ئەو شوێنەیە کە مێنیو یان نرخەکانت دەبینن، هەڵسەنگاندن دەخوێننەوە، حیجز دەکەن و دەکڕن — و ئەوەیە کە دەردەکەوێت کاتێک کەسێک لە Google دەگەڕێت بۆ ئەوەی تۆ پێشکەشی دەکەیت.",
"ئەو کارانەی تەنها پشت بە سۆشیال میدیا دەبەستن هەموو ئەو کڕیارانە لەدەست دەدەن کە دەگەڕێن لەبری گەڕان بە پەڕەکاندا. سۆشیال بەکاربهێنە بۆ هێنانی خەڵک — و ماڵپەڕ بۆ گۆڕینیان بۆ کڕیار."]}}
];

function money(n){return '$'+n.toLocaleString('en-US')}

function renderCalc(){
  var host=$('xcalc');if(!host)return;var L=lg(),t=X[L],te=X.en;
  var h='<div class="c pr"><p class="k">'+esc(t.ck)+'</p><h3 style="margin:0;font-size:30px;letter-spacing:-.03em">'+esc(t.ch)+'</h3>'
    +'<p style="color:var(--mut);font-size:14px;max-width:660px">'+esc(t.cd)+'</p>'
    +'<p class="xlbl">'+esc(t.ct)+'</p><div class="xopts">'
    +t.types.map(function(ty,i){var pr=ty.split('|');return '<label class="xopt"><input type="radio" name="xct" value="'+i+'"'+(i==1?' checked':'')+'><span><b>'+esc(pr[0])+'</b><span>'+esc(pr[1])+'</span></span><span class="xp">'+money(BASE[i])+'</span></label>'}).join('')
    +'</div><p class="xlbl">'+esc(t.ca)+'</p><div class="xopts">'
    +t.adds.map(function(a,i){return '<label class="xopt"><input type="checkbox" class="xad" value="'+i+'"><span><b>'+esc(a[0])+'</b></span><span class="xp">+'+money(a[1])+'</span></label>'}).join('')
    +'<label class="xopt"><input type="checkbox" id="xrush"><span><b>'+esc(t.rush)+'</b></span><span class="xp">+25%</span></label>'
    +'<label class="xopt"><input type="checkbox" id="xcare"><span><b>'+esc(t.careL)+'</b></span><span class="xp">'+esc(t.careP)+esc(t.perm)+'</span></label>'
    +'</div>'
    +'<div class="xtot"><div><div style="font-size:13px;color:var(--mut)">'+esc(t.tot)+'</div><div class="amt" id="xtot">$999</div><div style="font-size:13px;color:var(--mut)" id="xtot2"></div></div>'
    +'<a class="bt" id="xcta" href="#" target="_blank" rel="noopener" style="margin-inline-start:auto">'+esc(t.ccta)+'</a></div>'
    +'<p style="color:var(--mut);font-size:13px;margin-top:14px">'+esc(t.cnote)+'</p></div>';
  host.innerHTML=h;
  function upd(){
    var type=+(host.querySelector('input[name="xct"]:checked')||{}).value||0;
    var tot=BASE[type],sel=[];
    host.querySelectorAll('.xad').forEach(function(c){if(c.checked){tot+=t.adds[+c.value][1];sel.push(te.adds[+c.value][0])}});
    var rush=host.querySelector('#xrush').checked;
    if(rush)tot=Math.round(tot*1.25);
    var care=host.querySelector('#xcare').checked;
    host.querySelector('#xtot').textContent=money(tot)+' '+t.once+(care?' + '+money(10)+t.perm:'');
    host.querySelector('#xtot2').textContent=t.types[type].split('|')[0]+(sel.length?' · '+sel.map(function(s){return s}).join(', '):'');
    var msg='Hello YESES SOLUTION, I used the instant estimate on your website.\nType: '+te.types[type].split('|')[0]+'\nAdd-ons: '+(sel.length?sel.join(', '):'None')+'\nRush delivery: '+(rush?'Yes':'No')+'\nCare Plan: '+(care?'Yes ($10/mo)':'No')+'\nEstimate: '+money(tot)+' one-time'+(care?' + $10/mo':'')+'\nPlease confirm a final quote.';
    host.querySelector('#xcta').href=wa(msg);
  }
  host.addEventListener('change',upd);
  upd();
}

function renderAudit(){
  var host=$('xaudit');if(!host)return;var L=lg(),t=X[L];
  host.innerHTML='<p class="k">'+esc(t.ak)+'</p><h2>'+esc(t.ah)+'</h2><p style="color:var(--mut);max-width:660px;line-height:1.8">'+esc(t.ad)+'</p>'
    +'<form class="xf" id="xaf" style="margin-top:26px"><div class="two"><input name="n" required placeholder="'+esc(t.an)+'"><input name="e" type="email" required placeholder="'+esc(t.ae)+'"></div>'
    +'<input name="u" required placeholder="'+esc(t.au)+'"><textarea name="m" rows="3" placeholder="'+esc(t.am)+'"></textarea>'
    +'<div><button class="bt" type="submit" style="border:0;cursor:pointer;font-family:inherit">'+esc(t.ab)+'</button></div>'
    +'<p class="xok" id="xaok" hidden>'+esc(t.aok)+'</p></form>';
  host.querySelector('#xaf').addEventListener('submit',function(e){
    e.preventDefault();var f=e.target;
    var msg='Hello YESES SOLUTION, I would like a free audit of my website.\nName: '+f.n.value+'\nEmail: '+f.e.value+'\nMy website: '+f.u.value+(f.m.value?'\nNotes: '+f.m.value:'');
    host.querySelector('#xaok').hidden=false;
    window.open(wa(msg),'_blank');
  });
}

function renderBook(){

}

/* ---------- offer banner ---------- */
function tickCd(){
  var el=$('ycd');if(!el)return;
  var left=new Date(OFFER_END)-new Date();
  if(left<0){el.textContent='';return}
  var t=Y[lg()],dd=Math.floor(left/864e5),hh=Math.floor(left/36e5)%24,mm=Math.floor(left/6e4)%60,ss=Math.floor(left/1e3)%60;
  el.textContent=t.endsIn+' '+dd+t.d+' '+hh+t.h+' '+mm+t.m+' '+ss+t.s;
}
function renderOffer(){
  var host=$('yoffer');if(!host)return;var t=Y[lg()];
  if(sessionStorage.getItem('yoffer_x')){host.style.display='none';return}
  host.innerHTML=esc(t.offer)+'<span class="ycd" id="ycd"></span><button class="yx" id="yoffer-x" aria-label="Close">✕</button>';
  $('yoffer-x').onclick=function(){host.style.display='none';try{sessionStorage.setItem('yoffer_x','1')}catch(e){}};
  tickCd();
}

/* ---------- slots + stats ---------- */
var counted=false;
function renderSlots(){
  var host=$('yslots');if(!host)return;var t=Y[lg()];
  var mo='';try{mo=new Intl.DateTimeFormat(lg()=='en'?'en-US':(lg()=='ar'?'ar-EG':'ckb'),{month:'long'}).format(new Date())}catch(e){mo=''}
  var vals=[6,3,14,24];
  host.innerHTML='<div class="ystrip"><div class="yslot"><i></i>'+esc(t.slot(SLOTS,mo))+'</div>'
    +vals.map(function(v,i){return '<div class="ystat"><b data-cnt="'+v+'">'+(counted?v:0)+'</b><span>'+esc(t.stats[i])+'</span></div>'}).join('')+'</div>';
  if(counted)return;
  var nums=host.querySelectorAll('[data-cnt]');
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
    es.forEach(function(en){if(!en.isIntersecting)return;io.disconnect();counted=true;
      nums.forEach(function(n){var target=+n.getAttribute('data-cnt'),st=null;
        function step(ts){if(!st)st=ts;var p=Math.min((ts-st)/1100,1);n.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)}
        requestAnimationFrame(step);});
    })},{threshold:.3}):null;
  if(io)io.observe(host);else{counted=true;nums.forEach(function(n){n.textContent=n.getAttribute('data-cnt')})}
}

/* ---------- speed check ---------- */
function renderSpeed(){
  var host=$('yspeed');if(!host)return;var t=Y[lg()];
  host.innerHTML='<div class="ycard"><p class="k">'+esc(t.spK)+'</p><h3>'+esc(t.spH)+'</h3><p class="ysub">'+esc(t.spSub)+'</p>'
  +'<div style="display:flex;gap:10px;flex-wrap:wrap"><input class="yin" style="flex:1 1 240px;width:auto" id="ysp-u" type="text" inputmode="url" placeholder="'+esc(t.spPh)+'" dir="ltr">'
  +'<button class="ygo" id="ysp-b" type="button">'+esc(t.spBtn)+'</button></div><div id="ysp-r" style="margin-top:16px"></div></div>';
  $('ysp-b').onclick=function(){
    var u=$('ysp-u').value.trim();if(!u)return;
    if(!/^https?:\/\//i.test(u))u='https://'+u;
    var out=$('ysp-r'),btn=$('ysp-b');btn.disabled=true;
    out.innerHTML='<p style="color:var(--mut)">'+esc(t.spRun)+'</p>';
    var api='https://www.googleapis.com/pagespeedonline/v5/runPagespeed?strategy=mobile&category=performance&url='+encodeURIComponent(u);
    var ctrl=('AbortController' in window)?new AbortController():null;
    var to=setTimeout(function(){if(ctrl)ctrl.abort()},30000);
    fetch(api,ctrl?{signal:ctrl.signal}:undefined).then(function(r){return r.json()}).then(function(d){
      clearTimeout(to);btn.disabled=false;
      if(d.error||!d.lighthouseResult)throw new Error('psi');
      var lh=d.lighthouseResult,sc=Math.round(lh.categories.performance.score*100);
      var col=sc>=90?'#10b981':(sc>=50?'#f59e0b':'#ef4444');
      var verdict=sc>=90?t.spGood:(sc>=50?t.spMid:t.spBad);
      function av(id){var a=lh.audits[id];return a&&a.displayValue?a.displayValue:'—'}
      out.innerHTML='<div class="yscore"><div class="ring" style="background:conic-gradient('+col+' '+sc+'%,rgba(255,255,255,.1) 0)"><span style="background:#0d1319;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center">'+sc+'</span></div>'
      +'<div style="color:#e5e7eb;font-size:14px;line-height:1.9"><b style="color:#fff">'+esc(t.spScore)+'</b><br>LCP: '+esc(av('largest-contentful-paint'))+' · CLS: '+esc(av('cumulative-layout-shift'))+' · TBT: '+esc(av('total-blocking-time'))+'<br><span style="color:var(--mut)">'+esc(verdict)+'</span></div></div>';
    }).catch(function(){
      clearTimeout(to);btn.disabled=false;
      var psi='https://pagespeed.web.dev/analysis?url='+encodeURIComponent(u)+'&form_factor=mobile';
      out.innerHTML='<p style="color:#e5e7eb;font-size:14px;line-height:1.7">'+esc(t.spFail)+'</p>'
      +'<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="ygo" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="'+psi+'">'+esc(t.spOpen)+'</a></div>'
      +'<p style="color:var(--mut);font-size:13px;margin:12px 0 8px">'+esc(t.spOr)+'</p>'
      +'<a class="ygo" style="text-decoration:none;display:inline-block;background:#128c4a" target="_blank" rel="noopener" href="'+waLink(t.spMsg(u))+'">'+esc(t.spWa)+'</a>';
    });
  };
}

function hist(){try{return JSON.parse(localStorage.getItem('zs_history')||'[]')}catch(e){return[]}}
function saveHist(a){try{localStorage.setItem('zs_history',JSON.stringify(a.slice(0,200)))}catch(e){}}
function unlocked(){try{return sessionStorage.getItem('zs_ok')==='1'&&!!sessionStorage.getItem('zs_rep')}catch(e){return false}}
function sha256(str){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
function rowHTML(r,i,t){
  var d=new Date(r.ts||Date.now());
  var when=d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  var pill=r.status==='sent'?'<span class="zst ok">'+esc(t.sentL)+'</span>':'<span class="zst rec">'+esc(t.recL)+'</span>';
  return '<div class="zrow" data-zrow="'+i+'"><div><b>'+esc(r.agreement||'—')+'</b>'+pill+' · '+esc(r.client||'')+'<div class="zmeta">'+esc(when)+' · '+esc(t.rep)+': '+esc(r.rep||'')+(r.pkg?' · $'+esc(r.pkg):'')+'</div></div>'
  +'</div>';
}
function histInner(t){
  var a=hist();
  var rows=a.map(function(r,i){return rowHTML(r,i,t)}).join('');
  return '<h3>'+esc(t.histT)+'</h3><p class="znote">'+esc(t.note)+'</p>'
  +(rows||'<div class="zempty">'+esc(t.empty)+'</div>')
  ;
}
function wireHist(){
  var host=$('zsales');if(!host)return;
  host.querySelectorAll('[data-zrow]').forEach(function(row){row.onclick=function(){
    var r=hist()[+row.getAttribute('data-zrow')];if(!r)return;
    var u=PLATFORM_URL+'?view='+encodeURIComponent(r.agreement||'')+'&rep='+encodeURIComponent(sessionStorage.getItem('zs_rep')||r.rep||'');
    var f=$('zframe');if(f)f.src=u;window.scrollTo({top:host.offsetTop-80,behavior:'smooth'});
  }});
}
function refreshHist(){
  var w=$('zhist-wrap');if(!w)return;
  w.innerHTML=histInner(Z[lg()]);pullCentral();wireHist();
}
function renderSales(){
  var host=$('zsales');if(!host)return;var t=Z[lg()];
  if(!unlocked()){
    host.innerHTML='<div class="zcard"><h2>'+esc(t.title)+'</h2><p class="zsub">'+esc(t.sub)+'</p>'
    +'<input class="zin" id="z-name" type="text" autocomplete="name" placeholder="'+esc(t.namePh)+'">'
    +'<input class="zin" id="z-code" type="password" autocomplete="off" placeholder="'+esc(t.codePh)+'">'
    +'<button class="zgo" id="z-go" type="button">'+esc(t.enter)+'</button><p class="zerr" id="z-err"></p></div>';
    var go=function(){
      var name=($('z-name').value||'').trim(),code=($('z-code').value||'').trim(),err=$('z-err');
      var lockUntil=+(localStorage.getItem('zs_lock')||0);
      if(Date.now()<lockUntil){err.textContent=t.locked;return}
      if(!name){err.textContent=t.namePh;return}
      sha256(code).then(function(hx){
        if(hx===Z_HASH){
          try{sessionStorage.setItem('zs_ok','1');sessionStorage.setItem('zs_rep',name);localStorage.removeItem('zs_att');localStorage.removeItem('zs_lock')}catch(e){}
          renderSales();
        }else{
          var att=(+(localStorage.getItem('zs_att')||0))+1;
          try{localStorage.setItem('zs_att',att);if(att>=3)localStorage.setItem('zs_lock',Date.now()+60000)}catch(e){}
          err.textContent=att>=3?t.locked:t.wrong;
        }
      });
    };
    $('z-go').onclick=go;
    $('z-code').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
    return;
  }
  var repName=sessionStorage.getItem('zs_rep')||'';
  var src=PLATFORM_URL+(PLATFORM_URL.indexOf('?')<0?'?':'&')+'rep='+encodeURIComponent(repName);
  host.innerHTML='<div id="zflash"></div>'
  +'<div class="zbar"><span>'+esc(t.rep)+': <b>'+esc(repName)+'</b></span><span style="display:flex;gap:8px"><a class="zout" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(src)+'">'+esc(t.open)+'</a><button class="zout" id="z-out" type="button">'+esc(t.signout)+'</button></span></div>'
  +'<iframe id="zframe" title="Contract platform" src="'+esc(src)+'"></iframe>'
  +'<div class="zhist" id="zhist-wrap">'+histInner(t)+'</div>';
  $('z-out').onclick=function(){try{sessionStorage.removeItem('zs_ok');sessionStorage.removeItem('zs_rep')}catch(e){}renderSales()};
  wireHist();
}
var Z_API='57757a84ff37d38dec60ca6e';
function apiCall(body){body.key=Z_API;return fetch('contracts/api/records.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).catch(function(){return null})}
function pullCentral(){apiCall({action:'list'}).then(function(j){if(!j||!j.ok||!Array.isArray(j.records))return;var by={};hist().forEach(function(r){if(r&&r.agreement)by[r.agreement]=r});j.records.forEach(function(r){if(r&&r.agreement)by[r.agreement]=r});var merged=Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return (b.ts||0)-(a.ts||0)});saveHist(merged);var pg=$('p-sales');if(pg&&!pg.hidden&&unlocked())refreshHist()})}
window.addEventListener('message',function(e){
  var org='';try{org=new URL(PLATFORM_URL).origin}catch(x){}
  if(org&&e.origin!==org)return;
  var d=e.data;if(!d||(d.type!=='ys-contract-done'&&d.type!=='ys-contract-submit'))return;
  var a=hist(),found=false;
  for(var i=0;i<a.length;i++){
    if(a[i].agreement&&a[i].agreement===d.agreement){
      var keep=a[i];
      a[i]=d;a[i].status=(d.type==='ys-contract-done'||keep.status==='sent')?'sent':'recorded';
      found=true;break;
    }
  }
  if(!found){d.status=(d.type==='ys-contract-done')?'sent':'recorded';a.unshift(d)}
  saveHist(a);
  var pg=$('p-sales');
  if(pg&&!pg.hidden&&unlocked()){
    refreshHist();
    var fl=$('zflash');var t=Z[lg()];
    if(fl)fl.innerHTML='<div class="zflash">'+esc(t.saved)+' '+(d.agreement||'')+'</div>';
  }
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-l]');
  if(b)setTimeout(renderSales,300);
});
/* discreet footer entry */
(function(){
  var f=document.querySelector('footer');if(!f||$('z-sales-link'))return;
  var d=document.createElement('div');
  d.style.cssText='text-align:center;padding:12px 0 4px';

  f.appendChild(d);
})();
renderSales();
})();
</script>
